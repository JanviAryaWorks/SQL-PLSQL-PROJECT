<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Project | Oracle SQL Mastery</title>
    
    <style>
        :root {
            --primary-color: #f3e8ff;
            --primary-color-dark: #3498db;
            --border-color: #e5e7eb;
            --text-main: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            color: var(--text-main);
        }

        .main-content {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .category-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            padding: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .badge-label {
            background-color: var(--primary-color);
            color: var(--primary-color-dark);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            display: inline-block;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            color: #111;
            margin: 0 0 10px 0;
        }

        .sub-text {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 45px;
        }

        .intro-details-card {
            background-color: #ffffff;
            border: 1.5px solid #f3f4f6;
            border-radius: 24px;
            padding: 10px 30px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .label {
            color: #9ca3af;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .value {
            color: var(--primary-color-dark);
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Navbar Style (Optional, if you want it here too) */
        .navbar {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            background: white;
            border-bottom: 1px solid var(--border-color);
        }
        
        .logo { font-weight: bold; color: var(--primary-color-dark); }
        .nav-links a { text-decoration: none; color: #666; margin-left: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Janvi Arya</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html" style="color: var(--primary-color-dark); font-weight: 600;">About Project</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="category-card">
            
            
            <h1>DBMS Practical Implementation</h1>

            <div class="intro-details-card">
                <div class="detail-item">
                    <span class="label">STUDENT NAME</span>
                    <span class="value">Janvi Arya</span>
                </div>
                <div class="detail-item">
                    <span class="label">ROLL NUMBER</span>
                    <span class="value">7010/24</span>
                </div>
                <div class="detail-item">
                    <span class="label">CLASS & SEM</span>
                    <span class="value">BCA - 4th Semester</span>
                </div>
                <div class="detail-item">
                    <span class="label">SUBJECT</span>
                    <span class="value">DBMS (Oracle SQL)</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
