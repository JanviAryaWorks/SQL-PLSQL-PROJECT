<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <title>Queries Explorer | SQLMaster</title>
</head>
<body class="query-page">

    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">SQL<span>Master</span></a></div>
        <div class="category-badge" id="current-category">Category Name</div>
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
        </div>
    </nav>

    <div class="split-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h4>Practice Problems</h4>
                <p id="query-count">0 Queries</p>
            </div>
            <div id="query-list" class="query-list">
                </div>
        </aside>

        <main class="content-area">
            <div id="welcome-screen" class="empty-state">
                <div class="icon">🔍</div>
                <h2>Select a query to view details</h2>
                <p>Choose any problem from the left sidebar to see the SQL code and Oracle output.</p>
            </div>

            <div id="detail-view" class="detail-container hidden">
                <div class="question-box">
                    <span class="label">QUESTION</span>
                    <h2 id="display-question">Problem Statement</h2>
                </div>

                <div class="code-wrapper">
                    <div class="panel-header">
                        <span>SQL/PLSQL QUERY</span>
                        <button onclick="copyCode()">Copy</button>
                    </div>
                    <pre><code id="display-query">-- Query will appear here</code></pre>
                </div>

                <div class="output-wrapper">
                    <div class="panel-header">ORACLE OUTPUT</div>
                    <div id="display-output" class="output-screen">
                        </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
